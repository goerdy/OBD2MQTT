[platformio]
name = OBD2MQTT
build_dir = .platformio-clean/build

[env:xiao_esp32c6]
; Arduino 3.x provides ESP32-C6 support. Pin the platform for reproducible builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  h2zero/NimBLE-Arduino@2.5.1
build_flags =
  -D CORE_DEBUG_LEVEL=3
